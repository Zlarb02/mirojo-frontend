<div class="welcome-container">
  <header>
    <h1>Connexion</h1>
  </header>

  <section class="login-form">
    <!--  Connexion par Magic Link -->
    <div class="auth-section">
      <h2>Se connecter avec un lien magique</h2>
      <form [formGroup]="signInForm" (ngSubmit)="signInWithMagicLink()">
        <label for="magic-email">Email:</label>
        <input
          type="email"
          id="magic-email"
          formControlName="email"
          required
          placeholder="Enter your email"
        />
        <button
          type="submit"
          class="btn"
          [disabled]="loading || signInForm.invalid"
        >
          {{ loading ? "Envoi en cours..." : "Envoyer un lien magique" }}
        </button>
      </form>
    </div>

    <hr />

    <!-- 🔹 Inscription par Email/Mot de Passe -->
    <div class="auth-section">
      <h2>Créer un compte</h2>
      <form [formGroup]="signUpForm" (ngSubmit)="signUpWithEmail()">
        <label for="signup-email">Email:</label>
        <input
          type="email"
          id="signup-email"
          formControlName="email"
          required
          placeholder="Enter your email"
        />

        <label for="signup-password">Mot de passe:</label>
        <input
          type="password"
          id="signup-password"
          formControlName="password"
          required
          placeholder="Enter your password"
        />

        <button
          type="submit"
          class="btn"
          [disabled]="loading || signUpForm.invalid"
        >
          {{ loading ? "Création..." : "Créer un compte" }}
        </button>
      </form>
    </div>

    <hr />

    <!--  Connexion par Email/Mot de Passe -->
    <div class="auth-section">
      <h2>Se connecter avec un mot de passe</h2>
      <form [formGroup]="loginForm" (ngSubmit)="loginWithEmail()">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          required
          placeholder="Enter your email"
        />

        <label for="password">Mot de passe:</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          required
          placeholder="Enter your password"
        />

        <button
          type="submit"
          class="btn"
          [disabled]="loading || loginForm.invalid"
        >
          {{ loading ? "Connexion..." : "Se connecter" }}
        </button>
      </form>
    </div>

    <hr />

    <!--  Connexion avec Google -->
    <div class="auth-providers">
      <button
        type="button"
        class="btn google-btn"
        (click)="signInWithGoogle()"
        [disabled]="loading"
      >
        <img src="assets/google-logo.png" alt="Google Logo" />
        Se connecter avec Google
      </button>
    </div>
  </section>

  <app-footer></app-footer>
</div>
